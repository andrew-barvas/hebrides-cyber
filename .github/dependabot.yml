# Keeps the SHA-pinned GitHub Actions current. The workflows pin each action to a
# commit SHA (supply-chain hardening — a moved/compromised tag can't execute in a
# pipeline that holds the service-role key and the SWA deploy token); Dependabot
# raises a PR when a new release of a pinned action ships, updating both the SHA
# and the trailing `# vX` comment, so pinning doesn't mean going stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
