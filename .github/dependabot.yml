# Keeps the SHA-pinned GitHub Actions current. The workflows pin each action to a
# commit SHA (supply-chain hardening — a moved/compromised tag can't execute in a
# pipeline that holds the service-role key and the SWA deploy token); Dependabot
# raises a PR when a new release of a pinned action ships, updating both the SHA
# and the trailing `# vX` comment, so pinning doesn't mean going stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # The app's own npm dependencies. Before this, only the pinned Actions were
  # watched, so a vulnerable Next.js sat in the lockfile unnoticed (the CI install
  # log was printing "1 critical" on every run). Minor/patch bumps are grouped
  # into one weekly PR to keep the noise down; a security update still opens its
  # own PR straight away. Major bumps are left for a deliberate decision (the
  # Tailwind 3->4 move is one).
  - package-ecosystem: "npm"
    directory: "/hebridescyber-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
