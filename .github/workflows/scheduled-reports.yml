name: Scheduled Reports

# Sends due scheduled reports (daily/weekly/monthly) to configured recipients.
# Runs src/scripts/send-scheduled-reports.ts directly against Supabase,
# same pattern as monthly-digest.yml / daily-blog.yml.
#
# Requires:
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY - direct Supabase access
#   RESEND_API_KEY                           - email delivery
#   NEXT_PUBLIC_SITE_URL                     - optional, for dashboard links

on:
  schedule:
    # Every hour at :15 — daily reports land around 00:15 UTC,
    # weekly/monthly whenever their next_due passes.
    - cron: "15 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      # A PDF report is printed by headless Chromium (src/lib/reportPdf.ts),
      # which npm ci doesn't download. This job runs hourly, so the browser is
      # installed only when a PDF report is about to fall due. A failed install
      # only warns: the sender then emails that report as CSV, says so in the
      # email, and fails the run.
      - name: Check for a due PDF report
        id: pdf
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run reports:send -- --pdf-due-check
      - name: Cache Playwright browsers
        if: steps.pdf.outputs.pdf_due == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('hebridescyber-app/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pdf.outputs.pdf_due == 'true'
        working-directory: hebridescyber-app
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium || echo "::warning::Playwright system deps failed to install"
          else
            npx playwright install --with-deps chromium || echo "::warning::Playwright Chromium failed to install"
          fi

      - name: Send due scheduled reports
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run reports:send
