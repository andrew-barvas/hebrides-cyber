name: Database tests

# Applies every migration in hebridescyber-app/sql/migrations to a real
# Postgres (with a minimal Supabase shim, tests/db/shim.sql) and asserts row
# level security, claim_scan_job() concurrency and migration idempotency.
# The normal unit run skips these; they only run with RUN_DB_TESTS=1.

on:
  pull_request:
    paths:
      - "hebridescyber-app/sql/**"
      - "hebridescyber-app/tests/db/**"
      - "hebridescyber-app/vitest.db.config.mts"
      # Modules whose PostgREST query shapes only these tests can check.
      - "hebridescyber-app/src/lib/attackSurfaceMonitor.ts"
      - "hebridescyber-app/src/lib/findingsView.ts"
      - ".github/workflows/db-tests.yml"
  push:
    branches: [master]
    paths:
      - "hebridescyber-app/sql/**"
      - "hebridescyber-app/tests/db/**"
      - "hebridescyber-app/vitest.db.config.mts"
      # Modules whose PostgREST query shapes only these tests can check.
      - "hebridescyber-app/src/lib/attackSurfaceMonitor.ts"
      - "hebridescyber-app/src/lib/findingsView.ts"
      - ".github/workflows/db-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hebridescyber-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - run: npm ci

      # The findings-view test runs the real loader through a real PostgREST
      # (what Supabase uses), so the PostgREST query shapes it relies on are
      # checked. Pinned release, verified by checksum.
      - name: Install PostgREST
        working-directory: .
        env:
          POSTGREST_VERSION: v12.2.3
          POSTGREST_SHA256: 9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          echo "${POSTGREST_SHA256}  /tmp/postgrest.tar.xz" | sha256sum -c -
          mkdir -p /tmp/postgrest && tar -xJf /tmp/postgrest.tar.xz -C /tmp/postgrest
          echo "POSTGREST_BIN=/tmp/postgrest/postgrest" >> "$GITHUB_ENV"

      - run: npm run test:db
