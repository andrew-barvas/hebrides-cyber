name: Daily Cyber Security Brief

# Publishes the daily cyber security blog post (see src/lib/newsletter.ts's
# generateDailyBlogPost and src/scripts/generate-daily-blog.ts). Separate
# from weekly-newsletter.yml — same underlying real-event sourcing (CISA's
# KEV catalog, recent high-severity CVEs from NVD, and real breach/incident
# coverage from a small set of established security news RSS feeds), but a
# narrower day-by-day lookback window and its own slug, so the two never
# collide even when both run on the same day. The product's own aggregate
# scan stats appear as a short closing section here, not the main content.
#
# AI narrative write-up if Azure OpenAI is configured, otherwise a
# deterministic templated post built from the same real fetched data —
# either way, it publishes something rather than silently skipping the day.
#
# Runs src/scripts/generate-daily-blog.ts directly against Supabase, rather
# than curling a Next.js API route on Azure Static Web Apps — a real
# production run (run 32561015093) came back "Backend call failure" after
# 46s, Azure SWA's own proxy error for its Free-tier managed Functions layer
# killing a request. The same signature already diagnosed and fixed once
# this session for run-scan.ts; fixed here the same way, by not asking a
# once-a-day cold-started Azure Function to survive external fetches plus an
# unbounded Supabase query inside one HTTP request/response cycle.
# src/pages/api/generate-daily-blog.ts is deleted, not kept as a manual
# fallback — nothing else called it, and it's the thing that was breaking.
#
# Still deliberately not a Supabase Edge Function: this app has exactly one
# pattern for scheduled work (GitHub Actions running a script directly
# against Supabase, same as scheduled-scans.yml), and a second execution
# environment with its own secrets to keep in sync is a cost this app paid
# once already (the old standalone Azure Functions app) and isn't worth
# reintroducing.
#
# Requires:
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY - direct Supabase access
#   AZURE_OPENAI_*                            - optional, AI narrative write-up

on:
  schedule:
    # Every day at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Generate and publish the daily blog post
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: npm run newsletter:daily
