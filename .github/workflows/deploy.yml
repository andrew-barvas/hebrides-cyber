name: Deploy

# Builds and deploys the Next.js site to Azure Static Web Apps.
#
# E-20: quality gates now run on pull_request too, so a failing check
# blocks merge (with branch-protection configured) rather than only
# blocking deploy after merge.
#
# Migrations are applied before deploy by src/scripts/apply-migrations.ts
# (ledger + drift check). The schema check verifies the result. This eliminates
# the manual SQL Editor step that caused the 2026-09-13 incident.
#
# E-57: a health check curl runs post-deploy to catch runtime failures
# that pass the build but break the live site.
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN   - from `az staticwebapp create` or the Portal
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_URL                       - server-side URL (for migration check)
#   SUPABASE_SERVICE_ROLE_KEY          - service role key (for migration check)
#   DATABASE_URL                       - direct Postgres connection string (for db push)
#   SITE_URL                           - production URL (for post-deploy health check)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      baseline_up_to:
        description: "One-time: record migrations up to this number (e.g. 047) as already applied, before applying. Leave empty normally."
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality gates ──────────────────────────────────────────────────
  # Runs on both push and pull_request so PRs get feedback before merge.
  check:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      - name: Lint
        working-directory: hebridescyber-app
        run: npm run lint

      - name: Type check
        working-directory: hebridescyber-app
        run: npx tsc --noEmit

      # Unit + integration tests (Vitest — pure lib functions, API routes
      # with a mocked Supabase client, component render/interaction tests).
      # Coverage thresholds live in vitest.config.mts and are a calibrated
      # floor, not an aspirational target — see that file's comment. Report
      # uploaded as a build artifact so the HTML breakdown is inspectable
      # per run, not just the pass/fail number in this log.
      - name: Unit tests with coverage
        working-directory: hebridescyber-app
        run: npm run test:unit:coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: hebridescyber-app/coverage

      - name: Install Playwright browsers
        working-directory: hebridescyber-app
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: hebridescyber-app
        run: npm run test

  # ── Apply migrations + verify schema (E-49 / E-56) ────────────────
  # E-56 upgraded E-49 from "detect and fail" to "apply automatically":
  # runs supabase db push to apply any pending migrations, then verifies
  # the expected columns exist. Skipped when secrets aren't available
  # (e.g. fork PRs). Falls back to verify-only when DATABASE_URL isn't
  # set (the owner hasn't added it yet), preserving E-49's original
  # safety net while allowing incremental adoption.
  migration-check:
    runs-on: ubuntu-latest
    name: Apply migrations + verify schema
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      # Applies each pending migration once, in order, in its own transaction,
      # and records it in public.schema_migrations with a checksum (see
      # src/lib/migrationRunner.ts). It stops on the first failure, refuses
      # edited applied migrations, and refuses a database that has tables but no
      # history until it is baselined. The secret is read inside the script: a
      # step's own `env` isn't visible to its `if`, which is why the old step
      # never ran. Without DATABASE_URL the script exits 0 and says so.
      - name: Baseline existing database (manual, one-time)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_up_to != '' }}
        working-directory: hebridescyber-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASELINE_UP_TO: ${{ inputs.baseline_up_to }}
        run: npx tsx src/scripts/apply-migrations.ts baseline "$BASELINE_UP_TO"

      - name: Apply pending migrations
        working-directory: hebridescyber-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/scripts/apply-migrations.ts apply

      - name: Migration drift check
        working-directory: hebridescyber-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/scripts/apply-migrations.ts status

      # E-49: verify expected columns exist as a post-apply safety net.
      - name: Verify schema objects exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Supabase secrets are not set - skipping the schema check."
            exit 0
          fi

          check_table_column() {
            local table="$1" column="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/${table}?select=${column}&limit=0")

            if [ "$status" = "200" ]; then
              echo "OK: ${table}.${column}"
              return 0
            else
              echo "MISSING: ${table}.${column} (HTTP ${status})"
              return 1
            fi
          }

          FAILED=0

          check_table_column "contact_enquiries" "company" || FAILED=1
          check_table_column "monitored_targets" "scan_profile" || FAILED=1
          check_table_column "team_members" "role" || FAILED=1
          check_table_column "asset_inventory" "id" || FAILED=1
          check_table_column "api_specs" "id" || FAILED=1
          check_table_column "subscriptions" "notify_email" || FAILED=1
          check_table_column "cloud_credentials" "id" || FAILED=1
          check_table_column "scheduled_reports" "id" || FAILED=1
          check_table_column "ticket_integrations" "pagerduty_routing_key" || FAILED=1
          check_table_column "ticket_integrations" "opsgenie_api_key" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "::error::One or more required database columns/tables are missing."
            echo "::error::If DATABASE_URL is set, check supabase db push output above."
            echo "::error::Otherwise, apply pending migrations from sql/migrations/ manually."
            exit 1
          fi

          echo ""
          echo "All required schema objects verified."

  # ── Deploy ─────────────────────────────────────────────────────────
  # Only runs on push to master (not on pull_request), and only after
  # the check job passes.
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure Static Web Apps
    needs: [check, migration-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "hebridescyber-app"
          output_location: ".next"
          # Let Oryx build the app — .nvmrc pins Node 20 so Oryx doesn't
          # pick up the runner's system Node (previously 24.x, unsupported).
          # Env vars are passed here so Oryx's build has the Supabase keys
          # needed for generateStaticParams() at build time.
        env:
          NODE_VERSION: '20'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # E-57: post-deploy health check — curls /api/health on the live site
      # to catch runtime failures that pass the build. Waits 45s for Azure
      # SWA's Functions to warm up after deploy.
      - name: Post-deploy health check (E-57)
        # The secret is checked inside the script: a step's own `env` isn't
        # visible to its `if`, so `if: env.SITE_URL != ''` here never ran.
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "${SITE_URL}" ]; then
            echo "::notice::SITE_URL secret not set — skipping the post-deploy health check"
            exit 0
          fi
          echo "Waiting 45s for Azure Functions warm-up..."
          sleep 45
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/api/health" || echo "000")
          echo "Health check returned HTTP ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Post-deploy health check returned ${STATUS} — site may be degraded"
          fi
