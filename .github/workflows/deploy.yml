name: Deploy

# Builds and deploys the Next.js site to Azure Static Web Apps.
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN   - from `az staticwebapp create` or the Portal
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_AZURE_FUNCTIONS_URL

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-static-site:
    runs-on: ubuntu-latest
    name: Build and deploy Next.js site
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: hebridescyber-app
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: hebridescyber-app
        run: npm run test

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "hebridescyber-app"
          output_location: ".next"
          # Let Oryx build the app — .nvmrc pins Node 20 so Oryx doesn't
          # pick up the runner's system Node (previously 24.x, unsupported).
          # Env vars are passed here so Oryx's build has the Supabase keys
          # needed for generateStaticParams() at build time.
        env:
          NODE_VERSION: '20'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_AZURE_FUNCTIONS_URL: ${{ secrets.NEXT_PUBLIC_AZURE_FUNCTIONS_URL }}
