name: Deploy

# Builds and deploys the Next.js site to Azure Static Web Apps.
# The Azure Functions app (run-scan, generate-report, etc.) is not yet
# structured as a real Functions project — deploy-functions is intentionally
# omitted until src/functions/* has host.json and the v4 model wired up.
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN   - from `az staticwebapp create` or the Portal
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_AZURE_FUNCTIONS_URL

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-static-site:
    runs-on: ubuntu-latest
    name: Build and deploy Next.js site
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: hebridescyber-app
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: hebridescyber-app
        # Deliberately NOT passing the real Supabase secrets here — the
        # dashboard e2e test mocks auth against the fake project ref baked
        # into playwright.config.ts's webServer defaults.
        run: npm run test

      - name: Build
        working-directory: hebridescyber-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_AZURE_FUNCTIONS_URL: ${{ secrets.NEXT_PUBLIC_AZURE_FUNCTIONS_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "hebridescyber-app"
          output_location: ".next"
          # Skip Oryx's internal build — we already ran `npm run build` above.
          # Without this, Oryx picks up the runner's system Node (24.x) which
          # Azure SWA does not support (allowed: 18, 20, 22).
          skip_app_build: true
