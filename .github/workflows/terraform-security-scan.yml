name: Terraform Security Scan (Checkov)

# Static security analysis of azure/terraform/main.tf — the infrastructure
# scaffold for this app's Azure resources. Every finding Checkov's default
# policy set produces against this file has been triaged directly in
# main.tf itself (see the comment above azurerm_storage_account there):
# either fixed, mitigated where Checkov's static analysis doesn't credit
# the fix, or explicitly accepted with a documented reason and a
# `checkov:skip=` comment — never a silent, unexplained suppression.
#
# soft_fail is false: as of this workflow's creation the scan passes clean
# (0 failed checks) against that triage, so a red run here means a real,
# untriaged finding — either fix it or add a documented skip in main.tf,
# following the same pattern already there, rather than loosening this
# gate.
#
# "Use output" beyond pass/fail: output_format is cli,sarif, so the full
# per-check breakdown (not just pass/fail) is printed to this job's console
# log every run. NOT also uploaded as SARIF to GitHub's Security > Code
# scanning tab — that was tried first and failed with "Resource not
# accessible by integration": this repo is private, and Code Scanning
# requires GitHub Advanced Security on a private repo (a paid, per-committer
# feature this account doesn't have — confirmed via
# `gh api repos/andrew-barvas/hebrides-cyber` returning
# `security_and_analysis: null`). The failure has nothing to do with the
# workflow's own `permissions:` block; no combination of scopes fixes it
# without enabling GHAS. If GHAS is ever enabled on this repo, re-add an
# `upload-sarif` step to get the same findings surfaced in the Security tab.

on:
  push:
    paths:
      - "hebridescyber-app/azure/terraform/**"
      - ".github/workflows/terraform-security-scan.yml"
  pull_request:
    paths:
      - "hebridescyber-app/azure/terraform/**"
      - ".github/workflows/terraform-security-scan.yml"
  workflow_dispatch: {}

jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          directory: hebridescyber-app/azure/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false
