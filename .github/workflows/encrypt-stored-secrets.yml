name: Encrypt stored secrets

# One-off, manual. Customer secrets saved before encryption at rest existed
# (ticket-tracker and on-call tokens, authenticated-scan cookies and passwords,
# cloud credentials) are still plaintext in the database until their owner
# re-saves them. This rewrites them encrypted, using
# hebridescyber-app/src/scripts/encrypt-existing-secrets.ts.
#
# Safe to re-run: anything already encrypted is skipped. It is a DRY RUN unless
# you tick "confirm", so the first run only reports what it would change.
#
# Run it after CREDENTIALS_ENC_KEY is set as a repository secret (and in the
# app's settings with the same value).
#
# Requires:
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY - direct Supabase access
#   CREDENTIALS_ENC_KEY                       - the 32-byte key (base64 or hex)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tick to actually encrypt. Leave unticked for a dry run that only reports."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Encrypt legacy plaintext secrets
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENC_KEY: ${{ secrets.CREDENTIALS_ENC_KEY }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" = "true" ]; then
            npm run secrets:encrypt-existing -- --confirm
          else
            npm run secrets:encrypt-existing
          fi
