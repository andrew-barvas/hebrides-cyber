name: Deploy (Container Apps)

# Alternative deploy path to deploy.yml (Azure Static Web Apps) — builds
# the Dockerfile and pushes to Azure Container Apps. Manual trigger only:
# does NOT run on push to master, so it can't interfere with the live SWA
# deploy while this path is still being validated. See
# azure/terraform/main.tf's "Container Apps deploy path" section for the
# infrastructure this expects to already exist (apply that first).
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   AZURE_CREDENTIALS          - `az ad sp create-for-rbac --sdk-auth` output,
#                                 scoped to the resource group from main.tf
#   ACR_LOGIN_SERVER           - e.g. hebridescyberacr.azurecr.io
#   ACR_USERNAME               - azurerm_container_registry.main.admin_username
#   ACR_PASSWORD               - azurerm_container_registry.main.admin_password
#   AZURE_RESOURCE_GROUP       - matches var.resource_group_name in main.tf
#   AZURE_CONTAINER_APP_NAME   - matches azurerm_container_app.main.name
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_SITE_URL

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-containerapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build image and deploy to Container Apps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Log in to ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hebridescyber-app
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/hebridescyber-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/hebridescyber-app:${{ github.sha }}
