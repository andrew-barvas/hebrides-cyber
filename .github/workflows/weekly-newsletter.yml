name: Weekly Newsletter

# Publishes the weekly cybersecurity newsletter (see src/lib/newsletter.ts's
# generateWeeklyNewsletterPost and src/scripts/generate-weekly-newsletter.ts).
# Separate from daily-blog.yml — same underlying real-event sourcing (CISA's
# KEV catalog, recent high-severity CVEs from NVD, and real breach/incident
# coverage from a small set of established security news RSS feeds), but a
# full 7-day lookback window, a broader roundup framing, and a fuller look
# at the product's own aggregate scan stats. Own slug (week-of-YYYY-MM-DD vs
# the daily post's cyber-brief-YYYY-MM-DD), so the two never collide even
# when both run on the same day.
#
# AI narrative write-up if Azure OpenAI is configured, otherwise a
# deterministic templated post built from the same real fetched data —
# either way, it publishes something rather than silently skipping the week.
#
# Runs src/scripts/generate-weekly-newsletter.ts directly against Supabase —
# see daily-blog.yml's header for why this moved off curling an Azure-hosted
# API route (the same "Backend call failure" execution-ceiling failure this
# session already diagnosed and fixed once for run-scan.ts).
# src/pages/api/generate-newsletter.ts is deleted, not kept as a fallback.
#
# Requires:
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY - direct Supabase access
#   AZURE_OPENAI_*                            - optional, AI narrative write-up

on:
  schedule:
    # Every Monday at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Generate and publish the weekly newsletter
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: npm run newsletter:weekly
