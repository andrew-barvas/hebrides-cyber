name: Scheduled Scans

# Runs on a cron schedule and works through a Postgres-backed job queue —
# see sql/migrations/008_scan_jobs.sql — rather than calling run-scan
# directly per target. Two stages:
#   1. enqueue: inserts one scan_jobs row per verified monitored target
#      belonging to an active subscription.
#   2. work: a small matrix of parallel, ephemeral "worker" shards, each
#      looping claim_scan_job() (SKIP LOCKED) until the queue is empty or its
#      own time/count budget runs out. Whatever's left over is picked up by
#      the next scheduled run.
#
# This replaced a version that called src/functions/run-scan per target via
# curl — see src/lib/scanExecution.ts's executeScan(), which both that
# Function and these workers now share, for why scan behaviour is identical
# either way EXCEPT for one thing: only the `work` job here installs the
# real active-scanning tool suite (nmap/nuclei/sqlmap/ZAP — previously
# unwired in src/worker/tools/, meant for a BullMQ+Redis worker that never
# got connected to anything) and passes runExtendedTools: true, since this
# is the only environment with the binaries/daemon available. Azure Static
# Web Apps / Consumption Functions can't run installed binaries at all,
# which is why this runs here rather than in src/functions/run-scan.
#
# Fallback path. The primary path is the always-on Azure Container Apps Job
# (azure/terraform/scan-workers.tf), which runs the same queue loop from a
# fixed source IP and is scaled by KEDA on pending scan_jobs rows. Both work
# the same queue (claim_scan_job() SKIP LOCKED), so running this as well is
# harmless: whichever claims a job first runs it. Scans from here leave from
# a GitHub-hosted runner's IP, not the published one.
#
# Requires:
#   SUPABASE_URL                 - to query/enqueue/claim scan_jobs
#   SUPABASE_SERVICE_ROLE_KEY    - server-side only, never exposed to logs
#   RESEND_API_KEY               - post-scan emails (alerts, scan complete)
#   CREDENTIALS_ENC_KEY          - decrypts stored customer credentials (same value as the app's)

on:
  schedule:
    # Every day at 03:00 UTC. Cadence now differs per plan tier at the
    # enqueue step rather than the cron: enqueue-scheduled-scans.ts skips
    # any target whose most recent completed scan is still within its
    # plan's interval (src/lib/scanCadence.ts — basic weekly, pro/agency
    # daily). Running this cron daily and letting it no-op on non-due
    # targets is simpler and more robust than maintaining separate
    # per-plan crons.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-scans
  cancel-in-progress: false # don't cancel an in-flight scan run

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Enqueue scan jobs for active, verified monitored targets
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run queue:enqueue-scheduled-scans

  work:
    needs: enqueue
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Fixed-size shard pool, not one matrix entry per target — SKIP LOCKED
      # in claim_scan_job() means concurrent shards never claim the same job,
      # so this scales by adding shards, not by knowing the target list ahead
      # of time the way the old curl-matrix approach needed to.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      # The base suite's playwright.ts launches Chromium, but npm ci doesn't
      # download browsers, so before this step every scan's page-load check
      # errored on these runners. Browsers are cached per lockfile; the
      # system libraries (install-deps) still install on a cache hit. A
      # failure here only warns: the check then reports an error, as before.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('hebridescyber-app/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: hebridescyber-app
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium || echo "::warning::Playwright system deps failed to install"
          else
            npx playwright install --with-deps chromium || echo "::warning::Playwright Chromium failed to install"
          fi

      # --- Extended tool suite ---------------------------------------------
      # Every install, with its version and SHA-256 pin, lives in
      # hebridescyber-app/docker/scan-tools.sh: the same script the
      # scan-worker image runs (Dockerfile's `scan-worker` stage, run by the
      # Azure Container Apps Job in azure/terraform/scan-workers.tf). This
      # workflow is the fallback path, so it keeps working on its own and
      # can't drift onto different binaries from the image. Without
      # SCAN_TOOLS_STRICT the installs that were fail-soft here stay
      # fail-soft (src/worker/tools/*.ts then report not_configured for that
      # one check); apt, sqlmap, dalfox, nuclei, gospider, kiterunner and
      # prowler still fail the job. User-level installs land on
      # ~/.local/bin, already on the runner's PATH.
      - name: Install the extended scan tool suite
        run: bash hebridescyber-app/docker/scan-tools.sh all hebridescyber-app

      - name: Start ZAP daemon
        run: |
          # Image pinned by digest, not the floating :stable tag — this job
          # holds the Supabase service-role key, so the image it runs must not
          # change under us. Digest resolved from ghcr.io/zaproxy/zaproxy:stable
          # on 2026-10-27 (`docker buildx imagetools inspect` to re-resolve on a
          # deliberate bump). The API key is a random per-run value, never the
          # old literal "changeme": generated here, masked in the logs, and
          # handed to the worker step via $GITHUB_ENV so it never appears in the
          # workflow file.
          ZAP_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$ZAP_KEY"
          echo "ZAP_API_KEY=$ZAP_KEY" >> "$GITHUB_ENV"
          docker run -d --name zap -p 8090:8090 \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.key="$ZAP_KEY" \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true
          for i in $(seq 1 12); do
            if curl -sf "http://localhost:8090/JSON/core/view/version/?apikey=$ZAP_KEY" >/dev/null; then
              echo "ZAP is ready"
              exit 0
            fi
            echo "Waiting for ZAP ($i/12)..."
            sleep 5
          done
          echo "ZAP did not become ready in time — continuing anyway, zap.ts will report status: error for this run"

      - name: Work the scan job queue
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          # Worker failures reach Sentry (src/lib/workerSentry.ts); blank means no reporting.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # AI triage of unproven findings (aiTriage.ts): off unless the repo variable is 1.
          AI_TRIAGE: ${{ vars.AI_TRIAGE }}
          # Out-of-band (interactsh) for nuclei's ssrf/oast templates: blank keeps the public
          # pool, a host uses a self-hosted server, DISABLE_OAST=1 turns it off (nuclei.ts).
          INTERACTSH_SERVER: ${{ vars.INTERACTSH_SERVER }}
          INTERACTSH_TOKEN: ${{ secrets.INTERACTSH_TOKEN }}
          DISABLE_OAST: ${{ vars.DISABLE_OAST }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Every email executeScan sends after a scan (critical findings,
          # scan complete, SLA, new hostnames and DNS changes) goes through
          # src/lib/email.ts, which skips sending without this key. It was
          # never passed to the workers, so none of those emails ever went.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Decrypts the customer credentials stored encrypted at rest (cloud
          # posture keys, authenticated-scan cookies/passwords, ticket and
          # on-call tokens; src/lib/credentialEncryption.ts). Without it every
          # one of them is skipped as undecryptable. Must be the same value as
          # the app's CREDENTIALS_ENC_KEY.
          CREDENTIALS_ENC_KEY: ${{ secrets.CREDENTIALS_ENC_KEY }}
          # Our own AWS identity, used only to sts:AssumeRole into customers'
          # read-only audit roles for the Prowler IAM check (prowlerIam.ts).
          # Needs sts:AssumeRole and nothing else; blank means the check
          # reports an error for owners who connected a role.
          PROWLER_AWS_ACCESS_KEY_ID: ${{ secrets.PROWLER_AWS_ACCESS_KEY_ID }}
          PROWLER_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROWLER_AWS_SECRET_ACCESS_KEY }}
          WORKER_ID: gha-${{ github.run_id }}-${{ matrix.shard }}
          ZAP_API_URL: http://localhost:8090
          # Random per-run key exported to $GITHUB_ENV by the "Start ZAP daemon"
          # step above; never the literal "changeme".
          ZAP_API_KEY: ${{ env.ZAP_API_KEY }}
          TESTSSL_PATH: /opt/testssl.sh/testssl.sh
          # Compiled by the "Install kiterunner" step above; kiterunner.ts
          # no-ops to not_configured without it.
          KITERUNNER_WORDLIST: /opt/kiterunner/api-routes.kite
          # The curated content-discovery wordlist (ffuf, Tier A offensive
          # profile only); contentDiscovery.ts no-ops to not_configured without it.
          CONTENT_DISCOVERY_WORDLIST: ${{ github.workspace }}/hebridescyber-app/src/worker/tools/wordlists/content-dirs.txt
          # Was missing entirely before — secretScan.ts/dependencyManifest.ts/
          # dockerBaseImage.ts (src/lib/scanExecution.ts's runExtendedTools)
          # need GitHub access to run at all, and none of these three secrets
          # were ever passed into this job, so every real scheduled scan with
          # a connected repo silently got not_configured/not_applicable
          # results for all three checks. src/lib/githubApp.ts prefers the
          # App path when GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY are set, and
          # falls back to GITHUB_PAT — set whichever of these secrets exist;
          # an unset one just resolves to an empty string, same as today.
          #
          # The secrets on the right are named GH_* not GITHUB_* — GitHub
          # hard-rejects (HTTP 422) any Actions secret whose name starts with
          # "GITHUB_", reserved for its own auto-generated ones (the same
          # reason DIGEST_SERVICE_TOKEN isn't named GITHUB_ACTIONS_TOKEN
          # either — see .env.example). The env var name on the left stays
          # GITHUB_PAT/GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY because that's
          # what src/lib/githubApp.ts and every scanner module actually read
          # via process.env — only the *secret store's* name had to change,
          # confirmed the hard way when `gh secret set GITHUB_PAT` itself
          # 422'd. Azure app settings have no such restriction, so those can
          # (and do) keep the GITHUB_* name unchanged.
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # checkWpVulnDb/checkSafeBrowsing/checkHibp (src/lib/scanners/
          # wpvdb.ts, safeBrowsing.ts, hibp.ts) all run inside the base
          # passive suite, which this worker calls unconditionally — same
          # "was never wired into this job's env" gap as the GitHub secrets
          # above, just discovered later. Each degrades to its own
          # not_configured result when unset, same as an unset GITHUB_PAT.
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          # Strix AI pentest agent (Sprint 18) — needs an LLM API key to run.
          # strix.ts reads STRIX_LLM_API_KEY from process.env and passes it
          # to the strix CLI. The "offensive" and "ai-pentest" profiles both
          # enable strix, and both must clear run-queued-scan-jobs.ts's Tier A
          # + per-target authorization gate first; every other profile skips it
          # regardless of whether this secret is set.
          STRIX_LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
        run: npm run queue:run-worker

      - name: Stop ZAP daemon
        if: always()
        run: docker rm -f zap || true

  # SPRINT-PLAN H3: prove this run's shards actually scanned. Reads the
  # scan_jobs claimed as gha-<run_id>-<shard> and fails the run when scans ran
  # the extended tier but no tool completed (src/lib/scanRunVerification.ts).
  verify:
    needs: [enqueue, work]
    if: always() && needs.enqueue.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Verify the run scanned
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: npm run queue:verify-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-run-verification
          path: hebridescyber-app/scan-run-verification.json
          if-no-files-found: ignore
