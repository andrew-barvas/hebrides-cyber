name: Scheduled Scans

# Runs on a cron schedule and works through a Postgres-backed job queue —
# see sql/migrations/008_scan_jobs.sql — rather than calling run-scan
# directly per target. Two stages:
#   1. enqueue: inserts one scan_jobs row per verified monitored target
#      belonging to an active subscription.
#   2. work: a small matrix of parallel, ephemeral "worker" shards, each
#      looping claim_scan_job() (SKIP LOCKED) until the queue is empty or its
#      own time/count budget runs out. Whatever's left over is picked up by
#      the next scheduled run.
#
# This replaced a version that called src/functions/run-scan per target via
# curl — see src/lib/scanExecution.ts's executeScan(), which both that
# Function and these workers now share, for why scan behaviour is identical
# either way EXCEPT for one thing: only the `work` job here installs the
# real active-scanning tool suite (nmap/nuclei/sqlmap/ZAP — previously
# unwired in src/worker/tools/, meant for a BullMQ+Redis worker that never
# got connected to anything) and passes runExtendedTools: true, since this
# is the only environment with the binaries/daemon available. Azure Static
# Web Apps / Consumption Functions can't run installed binaries at all,
# which is why this runs here rather than in src/functions/run-scan.
#
# Requires:
#   SUPABASE_URL                 - to query/enqueue/claim scan_jobs
#   SUPABASE_SERVICE_ROLE_KEY    - server-side only, never exposed to logs
#   RESEND_API_KEY               - post-scan emails (alerts, scan complete)
#   CREDENTIALS_ENC_KEY          - decrypts stored customer credentials (same value as the app's)

on:
  schedule:
    # Every day at 03:00 UTC. Cadence now differs per plan tier at the
    # enqueue step rather than the cron: enqueue-scheduled-scans.ts skips
    # any target whose most recent completed scan is still within its
    # plan's interval (src/lib/scanCadence.ts — basic weekly, pro/agency
    # daily). Running this cron daily and letting it no-op on non-due
    # targets is simpler and more robust than maintaining separate
    # per-plan crons.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-scans
  cancel-in-progress: false # don't cancel an in-flight scan run

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Enqueue scan jobs for active, verified monitored targets
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run queue:enqueue-scheduled-scans

  work:
    needs: enqueue
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Fixed-size shard pool, not one matrix entry per target — SKIP LOCKED
      # in claim_scan_job() means concurrent shards never claim the same job,
      # so this scales by adding shards, not by knowing the target list ahead
      # of time the way the old curl-matrix approach needed to.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci

      # The base suite's playwright.ts launches Chromium, but npm ci doesn't
      # download browsers, so before this step every scan's page-load check
      # errored on these runners. Browsers are cached per lockfile; the
      # system libraries (install-deps) still install on a cache hit. A
      # failure here only warns: the check then reports an error, as before.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('hebridescyber-app/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: hebridescyber-app
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium || echo "::warning::Playwright system deps failed to install"
          else
            npx playwright install --with-deps chromium || echo "::warning::Playwright Chromium failed to install"
          fi

      # --- Extended tool suite ---------------------------------------------
      # Installed fresh per run rather than baked into a custom runner image,
      # since this workflow only runs once a day and a several-minute setup
      # cost is cheap compared to maintaining a custom image. (There is no
      # worker.Dockerfile: the BullMQ+Redis worker these tools were first
      # written for was never connected to anything, so this job is their only
      # runtime; the pinned versions live here, not in an image.)
      # src/worker/tools/*.ts already degrade to
      # "not_configured" gracefully if any of these fail to install, so a
      # broken step here fails soft (fewer findings that run), not the whole
      # job.
      - name: Install nmap, sqlmap and hydra
        run: |
          sudo apt-get update
          # hydra backs the Tier A offensive `credentialSpray` tool; it only
          # runs under the offensive profile and only when the owner has
          # configured a designated test account + wordlist + form spec, so
          # installing it does not by itself spray anything.
          sudo apt-get install -y --no-install-recommends nmap hydra python3 python3-pip
          pip3 install --break-system-packages sqlmap

      - name: Install commix
        # commix has no official PyPI release and is normally run from a git
        # checkout (see the CONFIDENCE NOTE in src/worker/tools/commix.ts).
        # Pinned to the v4.1 release tag rather than the default branch's HEAD:
        # this job holds the Supabase service-role key, so what it clones and
        # runs must not change whenever upstream pushes to master. A failed
        # clone is handled: a missing binary makes runCommix() return status
        # "not_configured" rather than throwing, so it degrades this one check,
        # not the whole job. (xsser was retired: it is not installable on the
        # runner image and ZAP already covers XSS.)
        run: |
          sudo git clone --depth 1 --branch v4.1 https://github.com/commixproject/commix.git /opt/commix || echo "commix clone failed — commix.ts will report status: not_configured"
          if [ -f /opt/commix/commix.py ]; then
            sudo ln -sf /opt/commix/commix.py /usr/local/bin/commix
            sudo chmod +x /usr/local/bin/commix
          fi

      - name: Install dalfox
        # Release binary pinned by version AND SHA-256 (checked against the
        # real asset digest from the GitHub release, 2026-10-23 — dalfox
        # publishes no separate checksums.txt covering per-platform binaries).
        # dalfox.ts parses its real v3.2.4 `-f json` output (fixtures/dalfox/).
        env:
          DALFOX_VERSION: 3.2.4
          DALFOX_SHA256: aaef3f3d26d2de6d4e61ef5295151d9de36e111981618136ac7ec54b578582b8
        run: |
          curl -fsSL \
            "https://github.com/hahwul/dalfox/releases/download/v${DALFOX_VERSION}/dalfox-v${DALFOX_VERSION}-linux-x86_64.tar.gz" \
            -o /tmp/dalfox.tar.gz
          echo "${DALFOX_SHA256}  /tmp/dalfox.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dalfox.tar.gz -C /tmp
          sudo install "/tmp/dalfox-v${DALFOX_VERSION}-linux-x86_64/dalfox" /usr/local/bin/dalfox
          rm -rf /tmp/dalfox.tar.gz "/tmp/dalfox-v${DALFOX_VERSION}-linux-x86_64"
          dalfox --version

      - name: Install nuclei
        # Release binaries are pinned by version AND SHA-256 (from the
        # project's own checksums file, cross-checked against the downloaded
        # asset): this job holds the Supabase service-role key, so a swapped
        # release asset must fail the check, not run.
        env:
          NUCLEI_VERSION: v3.3.9
          NUCLEI_SHA256: dfecedc31364d70b7291b347c74fd4d1d3185d30301c025b7490717d29daf28a
          # Templates pinned to a release tag instead of `-update-templates`'
          # floating "latest", so a scheduled scan is reproducible and a
          # compromised templates push can't change what this secret-holding job
          # runs. The version is recorded in nuclei's config (and the job log).
          # Bump this deliberately; cross-check compatibility with the pinned
          # nuclei binary above.
          NUCLEI_TEMPLATES_VERSION: v10.5.1
        run: |
          curl -fsSL \
            "https://github.com/projectdiscovery/nuclei/releases/download/${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION#v}_linux_amd64.zip" \
            -o /tmp/nuclei.zip
          echo "${NUCLEI_SHA256}  /tmp/nuclei.zip" | sha256sum -c -
          sudo unzip -o /tmp/nuclei.zip -d /usr/local/bin
          rm /tmp/nuclei.zip
          sudo chmod +x /usr/local/bin/nuclei
          # Shallow-clone the pinned templates tag into nuclei's default
          # templates directory ($HOME/nuclei-templates) and record the version
          # in its config. nuclei loads every template there and filters by
          # -tags at scan time exactly as before — only the version is fixed,
          # and no `-update-templates` network pull happens. Fail-soft like the
          # other installs: a failed clone leaves nuclei with no templates
          # (fewer findings), it does not fail the scan job.
          TEMPLATES_DIR="$HOME/nuclei-templates"
          git clone --depth 1 --branch "${NUCLEI_TEMPLATES_VERSION}" \
            https://github.com/projectdiscovery/nuclei-templates.git "$TEMPLATES_DIR" \
            && mkdir -p "$HOME/.config/nuclei" \
            && printf '{"nuclei-templates-directory":"%s","nuclei-templates-version":"%s"}\n' "$TEMPLATES_DIR" "${NUCLEI_TEMPLATES_VERSION}" > "$HOME/.config/nuclei/.templates-config.json" \
            && echo "nuclei templates ${NUCLEI_TEMPLATES_VERSION}: $(find "$TEMPLATES_DIR" -name '*.yaml' | wc -l) templates" \
            || echo "nuclei templates pin failed — nuclei.ts will run with no templates (fewer findings), not a failed job"

      - name: Install subfinder
        # src/lib/scanners/subdomains.ts shells out to `subfinder`, but this
        # workflow never installed it — so the subdomain-discovery step of
        # every scheduled scan has always returned status "not_configured"
        # (found in the 2026-09-30 delivery audit). Same ProjectDiscovery
        # release-zip pattern as nuclei above; a failed install degrades only
        # this check.
        env:
          SUBFINDER_VERSION: v2.16.0
          SUBFINDER_SHA256: 1b7f9c608e9a5bd59e609a5e09710d63c5485e92d3d49dc2c16eb4fdbe10cb60
        run: |
          curl -fsSL \
            "https://github.com/projectdiscovery/subfinder/releases/download/${SUBFINDER_VERSION}/subfinder_${SUBFINDER_VERSION#v}_linux_amd64.zip" \
            -o /tmp/subfinder.zip \
            && echo "${SUBFINDER_SHA256}  /tmp/subfinder.zip" | sha256sum -c - \
            && sudo unzip -o /tmp/subfinder.zip subfinder -d /usr/local/bin \
            && sudo chmod +x /usr/local/bin/subfinder \
            && subfinder -version \
            || echo "subfinder install failed — subdomains.ts will report status: not_configured"
          rm -f /tmp/subfinder.zip

      - name: Install httpx
        # src/lib/scanners/hostProbe.ts shells out to `httpx` to probe the hosts
        # subfinder discovered for a live HTTP service (status/title/tech/TLS).
        # Same ProjectDiscovery release-zip pattern as subfinder/nuclei; a failed
        # install degrades only this check (hostProbe.ts → not_configured).
        # SHA-256 is the publisher's own httpx_1.6.10_checksums.txt line.
        env:
          HTTPX_VERSION: v1.6.10
          HTTPX_SHA256: e7eb8473530c2d0eb4eb132c7253c0138745d622970f36413c1f349ddd60edb7
        run: |
          curl -fsSL \
            "https://github.com/projectdiscovery/httpx/releases/download/${HTTPX_VERSION}/httpx_${HTTPX_VERSION#v}_linux_amd64.zip" \
            -o /tmp/httpx.zip \
            && echo "${HTTPX_SHA256}  /tmp/httpx.zip" | sha256sum -c - \
            && sudo unzip -o /tmp/httpx.zip httpx -d /usr/local/bin \
            && sudo chmod +x /usr/local/bin/httpx \
            && httpx -version \
            || echo "httpx install failed — hostProbe.ts will report status: not_configured"
          rm -f /tmp/httpx.zip

      - name: Install katana
        # src/worker/tools/katana.ts: JavaScript-aware page discovery, whose
        # pages then get the crawler's page checks (katana.* findings). MIT.
        # SHA-256 is the publisher's own katana-1.8.0-checksums.txt line,
        # cross-checked against the downloaded asset. A failed install
        # degrades only this check (katana.ts → not_configured).
        env:
          KATANA_VERSION: v1.8.0
          KATANA_SHA256: cb027ae99d0757061b70c07a15c7a80f62c5a535ab52c4a329f80c4b0a7309d2
        run: |
          curl -fsSL \
            "https://github.com/projectdiscovery/katana/releases/download/${KATANA_VERSION}/katana_${KATANA_VERSION#v}_linux_amd64.zip" \
            -o /tmp/katana.zip \
            && echo "${KATANA_SHA256}  /tmp/katana.zip" | sha256sum -c - \
            && sudo unzip -o /tmp/katana.zip katana -d /usr/local/bin \
            && sudo chmod +x /usr/local/bin/katana \
            && katana -version \
            || echo "katana install failed — katana.ts will report status: not_configured"
          rm -f /tmp/katana.zip

      - name: Install naabu
        # src/worker/tools/networkExposure.ts shells out to `naabu` for broad
        # top-1000 port discovery, then nmap -sV on whatever's open. MIT.
        # Same ProjectDiscovery release-zip pattern as httpx/katana; SHA-256 is
        # the publisher's own naabu-checksums.txt line. naabu falls back to an
        # unprivileged connect scan when it can't open raw sockets, so no root
        # is needed; libpcap-dev is installed so the privileged path also works.
        # A failed install degrades only this check (networkExposure.ts →
        # not_configured).
        env:
          NAABU_VERSION: v2.6.1
          NAABU_SHA256: 018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90
        run: |
          sudo apt-get install -y libpcap-dev >/dev/null 2>&1 || true
          curl -fsSL \
            "https://github.com/projectdiscovery/naabu/releases/download/${NAABU_VERSION}/naabu_${NAABU_VERSION#v}_linux_amd64.zip" \
            -o /tmp/naabu.zip \
            && echo "${NAABU_SHA256}  /tmp/naabu.zip" | sha256sum -c - \
            && sudo unzip -o /tmp/naabu.zip naabu -d /usr/local/bin \
            && sudo chmod +x /usr/local/bin/naabu \
            && naabu -version \
            || echo "naabu install failed — networkExposure.ts will report status: not_configured"
          rm -f /tmp/naabu.zip

      - name: Install ffuf (Tier A offensive content discovery)
        # src/worker/tools/contentDiscovery.ts shells out to `ffuf` for the Tier A
        # offensive profile's bounded directory/path discovery. Pinned release
        # tarball + SHA-256 (publisher's own ffuf_2.1.0_checksums.txt). Only ever
        # runs under the `offensive` profile (Tier A + per-scan authorization);
        # a failed install degrades only that check (contentDiscovery.ts →
        # not_configured).
        env:
          FFUF_VERSION: 2.1.0
          FFUF_SHA256: fc2c82736c14dcbea4daf3d3cf3878c1c4773008ba45c2bc0fceba7d17b40bb5
        run: |
          curl -fsSL \
            "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/ffuf.tar.gz \
            && echo "${FFUF_SHA256}  /tmp/ffuf.tar.gz" | sha256sum -c - \
            && sudo tar -xzf /tmp/ffuf.tar.gz -C /usr/local/bin ffuf \
            && sudo chmod +x /usr/local/bin/ffuf \
            && ffuf -V \
            || echo "ffuf install failed — contentDiscovery.ts will report status: not_configured"
          rm -f /tmp/ffuf.tar.gz

      - name: Install gitleaks and testssl.sh
        # secretScan.ts (Gitleaks) and deepTls.ts (testssl.sh) have always
        # degraded to status: "not_configured" on every real scheduled scan
        # because this workflow never actually installed either binary,
        # despite CLAUDE.md/docs/architecture.md claiming it did. Gitleaks
        # ships as a GitHub release binary; testssl.sh is a shell script with
        # no compiled release, so it's git-cloned and pointed to via
        # TESTSSL_PATH (deepTls.ts already reads that env var, falling back
        # to a bare "testssl.sh" on PATH otherwise) rather than symlinked
        # onto PATH under its own name.
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz \
            && echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c - \
            || { echo "gitleaks download or checksum failed — secretScan.ts will report status: not_configured"; rm -f /tmp/gitleaks.tar.gz; }
          if [ -f /tmp/gitleaks.tar.gz ]; then
            sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
            rm /tmp/gitleaks.tar.gz
          fi
          # Pinned to the v3.2.4 release tag, not the default branch's HEAD, so
          # this secret-holding job runs a known testssl.sh revision.
          sudo git clone --depth 1 --branch v3.2.4 https://github.com/testssl/testssl.sh.git /opt/testssl.sh \
            || echo "testssl.sh clone failed — deepTls.ts will report status: not_configured"

      - name: Install trivy
        # Container base-image CVE scanning + IaC misconfiguration scanning
        # (src/lib/scanners/trivyScan.ts) — fills the real-installed-package
        # gap src/lib/scanners/dockerBaseImage.ts's own header comment
        # explicitly declines to fill. Installed unconditionally alongside
        # every other tool here, same "install everything, let each check
        # degrade to not_configured/not_applicable if unneeded" philosophy —
        # only scans that actually have a connected repo run it at all.
        # Release tarball pinned by version and SHA-256, not a piped install
        # script. The previous pin (0.58.1) no longer has release assets, so
        # trivy had silently never installed: every trivy check reported
        # not_configured. 0.75.0's JSON output is checked against the parser
        # by src/worker/tools/fixtures/trivy/config-0.75.0.json.
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz \
            && echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c - \
            && sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy \
            || echo "trivy install failed — trivyScan.ts will report status: not_configured"
          rm -f /tmp/trivy.tar.gz
          trivy --version || true
          # Prime the vulnerability DB once per job so a real scan later
          # doesn't burn its own exec timeout on a first-run download —
          # matches nuclei's own "-update-templates" priming step above.
          trivy image --download-db-only --quiet || echo "trivy DB download failed — image scans will report status: error"

      - name: Install opengrep
        # Static code analysis of the connected repo (src/worker/tools/sast.ts)
        # with our own rule pack in hebridescyber-app/sast-rules/. Opengrep is
        # LGPL-2.1 and runs as a separate binary. Pinned release + the
        # asset's SHA-256 as published by GitHub's release API, so a swapped
        # asset fails the check instead of running. A failed install only
        # degrades this check: sast.ts reports status not_configured.
        env:
          OPENGREP_VERSION: 1.30.0
          OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
        run: |
          curl -fsSL \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86" \
            -o /tmp/opengrep \
            && echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c - \
            && sudo install -m 0755 /tmp/opengrep /usr/local/bin/opengrep \
            && opengrep --version \
            || echo "opengrep install failed — sast.ts will report status: not_configured"
          rm -f /tmp/opengrep

      - name: Install zizmor
        # GitHub Actions workflow security scanning of the connected repo
        # (src/worker/tools/workflowSecurity.ts). zizmor (MIT) ships on PyPI
        # as version-pinned source/wheels, not a single downloadable binary
        # asset — pip verifies the installed files against the hashes in
        # PyPI's own package index for the exact pinned version, which is the
        # equivalent guarantee a separate SHA-256 check gives the binaries
        # downloaded above. A failed install only degrades this check:
        # workflowSecurity.ts reports status not_configured.
        run: |
          pip3 install --break-system-packages zizmor==1.30.1 \
            && zizmor --version \
            || echo "zizmor install failed — workflowSecurity.ts will report status: not_configured"

      - name: Install badsecrets
        # Known framework secret keys (src/worker/tools/badsecrets.ts).
        # AGPL-3.0: run unmodified as a separate program, in its own
        # virtualenv so its Django/yara dependencies can't clash with the
        # other pip-installed tools. Pinned on PyPI like zizmor; pip checks the
        # files against PyPI's hashes for that exact release. A failed install
        # only degrades the check: badsecrets.ts reports not_configured.
        run: |
          (sudo python3 -m venv /opt/badsecrets \
            && sudo /opt/badsecrets/bin/pip install --quiet badsecrets==1.2.0 \
            && sudo ln -sf /opt/badsecrets/bin/badsecrets /usr/local/bin/badsecrets \
            && badsecrets -l --no-color | tail -3) \
            || echo "badsecrets install failed — badsecrets.ts will report status: not_configured"

      - name: Install whatwaf, wpscan, and cmsmap
        run: |
          # WhatWaf has no PyPI package, so `pip install whatwaf` never resolved
          # and whatwaf.ts has always been not_configured. Install from the
          # pinned v1.9 release tag instead (its setup.py installs the `whatwaf`
          # script the wrapper calls).
          ( sudo git clone --depth 1 --branch v1.9 https://github.com/Ekultek/WhatWaf.git /opt/whatwaf \
            && sudo pip3 install --break-system-packages /opt/whatwaf ) \
            || echo "whatwaf install failed — whatwaf.ts will report status: not_configured"
          sudo gem install wpscan -v 4.2.0 --no-document \
            || echo "wpscan install failed — wpscan.ts will report status: not_configured"
          # CMSmap has no PyPI package and no release tags, so `pip install cmsmap`
          # never resolved — cmsmap.ts was silently not_configured on every run.
          # Install from a pinned git commit instead (its setup.py registers the
          # `cmsmap` console script the wrapper calls).
          sudo git clone https://github.com/Dionach/CMSmap.git /opt/cmsmap \
            && sudo git -C /opt/cmsmap checkout 59dd0e2b3b0c751c6da2b0565374ab83c736b0e6 \
            && sudo pip3 install --break-system-packages /opt/cmsmap \
            || echo "cmsmap install failed — cmsmap.ts will report status: not_configured"

      - name: Install photon and gospider
        # gospider never installed before: the asset name was wrong
        # (linux_amd64 vs linux_x86_64) and the binary lives inside a folder
        # in the zip. Correct name + SHA-256 of the downloaded asset (jaeles
        # publishes no checksums file, so this is the hash we verified, not a
        # publisher one). gospider.ts parses its real v1.1.6 --json output.
        env:
          GOSPIDER_VERSION: 1.1.6
          GOSPIDER_SHA256: 41bdd76aff8d063655dc473f035ca7659f8549fbf264be5185f50d288666f93d
        run: |
          # Pinned for a reproducible run. NOTE: PyPI `photon` is a third-party
          # upload, not s0md3v/Photon (which ships no pip entry point), so its
          # CLI can't be verified against photon.ts — photon is excluded from the
          # default `full` profile for that reason (see scanProfiles.ts) and runs
          # only under the opt-in osint/offensive profiles.
          pip3 install --break-system-packages photon==1.1.8.3 \
            || echo "photon install failed — photon.ts will report status: not_configured"
          curl -fsSL \
            "https://github.com/jaeles-project/gospider/releases/download/v${GOSPIDER_VERSION}/gospider_v${GOSPIDER_VERSION}_linux_x86_64.zip" \
            -o /tmp/gospider.zip
          echo "${GOSPIDER_SHA256}  /tmp/gospider.zip" | sha256sum -c -
          unzip -o /tmp/gospider.zip -d /tmp/gospider
          sudo install "/tmp/gospider/gospider_v${GOSPIDER_VERSION}_linux_x86_64/gospider" /usr/local/bin/gospider
          rm -rf /tmp/gospider /tmp/gospider.zip

      - name: Install kiterunner and arjun
        # kiterunner never installed before: v2.0.2 doesn't exist (latest is
        # v1.0.2) and the wordlist was never provided. v1.0.2 binary pinned by
        # SHA-256 (no publisher checksums file). The wordlist is our own
        # curated route list compiled to .kite here; KITERUNNER_WORDLIST points
        # kiterunner.ts at it (it no-ops without that env var).
        env:
          KITERUNNER_VERSION: 1.0.2
          KITERUNNER_SHA256: 6f0b70aabf747de592445a690281897eebbc45927e9264185d34ffb11637613b
        run: |
          curl -fsSL \
            "https://github.com/assetnote/kiterunner/releases/download/v${KITERUNNER_VERSION}/kiterunner_${KITERUNNER_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kiterunner.tar.gz
          echo "${KITERUNNER_SHA256}  /tmp/kiterunner.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kiterunner.tar.gz -C /usr/local/bin kr
          sudo chmod +x /usr/local/bin/kr
          rm /tmp/kiterunner.tar.gz
          sudo mkdir -p /opt/kiterunner
          # The wordlist lives under hebridescyber-app/ (two-root repo layout) and
          # this step runs from the repo root, so the path must include that prefix
          # — the bare src/worker/... path failed every scheduled run with
          # "no such file or directory". Guard it like every other tool install so a
          # convert failure makes kiterunner.ts report not_configured instead of
          # failing the whole scan shard (it no-ops without KITERUNNER_WORDLIST).
          kr kb convert hebridescyber-app/src/worker/tools/wordlists/api-routes.txt /opt/kiterunner/api-routes.kite \
            || echo "kiterunner wordlist convert failed — kiterunner.ts will report status: not_configured"
          pip3 install --break-system-packages arjun==2.2.7 \
            || echo "arjun install failed — arjun.ts will report status: not_configured"

      # strix (STRIX_VERSION 0.5.0) and cairn (CAIRN_VERSION 1.0.0) were
      # installed here with no checksum. Those release tags do not exist
      # (strix publishes v1.x, cairn v0.2.x), so both downloads silently failed
      # and the tools stayed not_configured. The owner decision of 2026-10-23
      # is to leave strix/cairn/credentialSpray not_configured and not market
      # them (docs/NEXT-STEPS.md), so these unverifiable, unchecksummed
      # downloads are removed rather than left running in a job that holds the
      # Supabase service-role key. Both are OFFENSIVE_ONLY_TOOLS, so no default
      # profile ever ran them; re-pin to real tags (strix v1.x / cairn v0.2.x)
      # with a SHA-256 check before any future attempt.

      - name: Start ZAP daemon
        run: |
          # Image pinned by digest, not the floating :stable tag — this job
          # holds the Supabase service-role key, so the image it runs must not
          # change under us. Digest resolved from ghcr.io/zaproxy/zaproxy:stable
          # on 2026-10-27 (`docker buildx imagetools inspect` to re-resolve on a
          # deliberate bump). The API key is a random per-run value, never the
          # old literal "changeme": generated here, masked in the logs, and
          # handed to the worker step via $GITHUB_ENV so it never appears in the
          # workflow file.
          ZAP_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$ZAP_KEY"
          echo "ZAP_API_KEY=$ZAP_KEY" >> "$GITHUB_ENV"
          docker run -d --name zap -p 8090:8090 \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.key="$ZAP_KEY" \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true
          for i in $(seq 1 12); do
            if curl -sf "http://localhost:8090/JSON/core/view/version/?apikey=$ZAP_KEY" >/dev/null; then
              echo "ZAP is ready"
              exit 0
            fi
            echo "Waiting for ZAP ($i/12)..."
            sleep 5
          done
          echo "ZAP did not become ready in time — continuing anyway, zap.ts will report status: error for this run"

      - name: Work the scan job queue
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          # Worker failures reach Sentry (src/lib/workerSentry.ts); blank means no reporting.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # AI triage of unproven findings (aiTriage.ts): off unless the repo variable is 1.
          AI_TRIAGE: ${{ vars.AI_TRIAGE }}
          # Out-of-band (interactsh) for nuclei's ssrf/oast templates: blank keeps the public
          # pool, a host uses a self-hosted server, DISABLE_OAST=1 turns it off (nuclei.ts).
          INTERACTSH_SERVER: ${{ vars.INTERACTSH_SERVER }}
          INTERACTSH_TOKEN: ${{ secrets.INTERACTSH_TOKEN }}
          DISABLE_OAST: ${{ vars.DISABLE_OAST }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Every email executeScan sends after a scan (critical findings,
          # scan complete, SLA, new hostnames and DNS changes) goes through
          # src/lib/email.ts, which skips sending without this key. It was
          # never passed to the workers, so none of those emails ever went.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Decrypts the customer credentials stored encrypted at rest (cloud
          # posture keys, authenticated-scan cookies/passwords, ticket and
          # on-call tokens; src/lib/credentialEncryption.ts). Without it every
          # one of them is skipped as undecryptable. Must be the same value as
          # the app's CREDENTIALS_ENC_KEY.
          CREDENTIALS_ENC_KEY: ${{ secrets.CREDENTIALS_ENC_KEY }}
          WORKER_ID: gha-${{ github.run_id }}-${{ matrix.shard }}
          ZAP_API_URL: http://localhost:8090
          # Random per-run key exported to $GITHUB_ENV by the "Start ZAP daemon"
          # step above; never the literal "changeme".
          ZAP_API_KEY: ${{ env.ZAP_API_KEY }}
          TESTSSL_PATH: /opt/testssl.sh/testssl.sh
          # Compiled by the "Install kiterunner" step above; kiterunner.ts
          # no-ops to not_configured without it.
          KITERUNNER_WORDLIST: /opt/kiterunner/api-routes.kite
          # The curated content-discovery wordlist (ffuf, Tier A offensive
          # profile only); contentDiscovery.ts no-ops to not_configured without it.
          CONTENT_DISCOVERY_WORDLIST: ${{ github.workspace }}/hebridescyber-app/src/worker/tools/wordlists/content-dirs.txt
          # Was missing entirely before — secretScan.ts/dependencyManifest.ts/
          # dockerBaseImage.ts (src/lib/scanExecution.ts's runExtendedTools)
          # need GitHub access to run at all, and none of these three secrets
          # were ever passed into this job, so every real scheduled scan with
          # a connected repo silently got not_configured/not_applicable
          # results for all three checks. src/lib/githubApp.ts prefers the
          # App path when GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY are set, and
          # falls back to GITHUB_PAT — set whichever of these secrets exist;
          # an unset one just resolves to an empty string, same as today.
          #
          # The secrets on the right are named GH_* not GITHUB_* — GitHub
          # hard-rejects (HTTP 422) any Actions secret whose name starts with
          # "GITHUB_", reserved for its own auto-generated ones (the same
          # reason DIGEST_SERVICE_TOKEN isn't named GITHUB_ACTIONS_TOKEN
          # either — see .env.example). The env var name on the left stays
          # GITHUB_PAT/GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY because that's
          # what src/lib/githubApp.ts and every scanner module actually read
          # via process.env — only the *secret store's* name had to change,
          # confirmed the hard way when `gh secret set GITHUB_PAT` itself
          # 422'd. Azure app settings have no such restriction, so those can
          # (and do) keep the GITHUB_* name unchanged.
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # checkWpVulnDb/checkSafeBrowsing/checkHibp (src/lib/scanners/
          # wpvdb.ts, safeBrowsing.ts, hibp.ts) all run inside the base
          # passive suite, which this worker calls unconditionally — same
          # "was never wired into this job's env" gap as the GitHub secrets
          # above, just discovered later. Each degrades to its own
          # not_configured result when unset, same as an unset GITHUB_PAT.
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          # Strix AI pentest agent (Sprint 18) — needs an LLM API key to run.
          # strix.ts reads STRIX_LLM_API_KEY from process.env and passes it
          # to the strix CLI. The "offensive" and "ai-pentest" profiles both
          # enable strix, and both must clear run-queued-scan-jobs.ts's Tier A
          # + per-target authorization gate first; every other profile skips it
          # regardless of whether this secret is set.
          STRIX_LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
        run: npm run queue:run-worker

      - name: Stop ZAP daemon
        if: always()
        run: docker rm -f zap || true
