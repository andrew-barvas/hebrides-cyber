name: Tool integration

# Runs the real sqlmap, nuclei, gospider and kiterunner (and, informationally,
# commix) against a deliberately vulnerable app on localhost, so the parsers in
# src/worker/tools are checked against real output rather than assumptions
# (E-72). Weekly, on changes to the tool wrappers, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "hebridescyber-app/src/worker/tools/sqlmap*.ts"
      - "hebridescyber-app/src/worker/tools/commix*.ts"
      - "hebridescyber-app/src/worker/tools/nuclei*.ts"
      - "hebridescyber-app/src/worker/tools/gospider*.ts"
      - "hebridescyber-app/src/worker/tools/kiterunner*.ts"
      - "hebridescyber-app/src/worker/tools/httpProbe*.ts"
      - "hebridescyber-app/src/worker/tools/contentDiscovery*.ts"
      - "hebridescyber-app/src/worker/tools/badsecrets*.ts"
      - "hebridescyber-app/src/worker/tools/katana*.ts"
      - "hebridescyber-app/src/lib/scanners/crawler.ts"
      - "hebridescyber-app/src/worker/tools/wordlists/**"
      - "hebridescyber-app/src/lib/scanners/hostProbe*.ts"
      - "hebridescyber-app/src/worker/tools/networkExposure*.ts"
      - "hebridescyber-app/src/lib/execTool.ts"
      - "hebridescyber-app/tests/fixtures/test-app/**"
      - ".github/workflows/tool-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hebridescyber-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - run: npm ci

      - name: Install sqlmap
        run: pip3 install --break-system-packages sqlmap

      - name: Install nmap (for networkExposure service detection)
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Install badsecrets (pinned, own virtualenv)
        # Same install as scheduled-scans.yml.
        run: |
          sudo python3 -m venv /opt/badsecrets
          sudo /opt/badsecrets/bin/pip install --quiet badsecrets==1.2.0
          sudo ln -sf /opt/badsecrets/bin/badsecrets /usr/local/bin/badsecrets
          badsecrets -l --no-color | tail -5

      - name: Install nuclei, gospider, kiterunner, httpx, ffuf, katana and naabu (pinned)
        env:
          NUCLEI_VERSION: v3.3.9
          NUCLEI_SHA256: dfecedc31364d70b7291b347c74fd4d1d3185d30301c025b7490717d29daf28a
          GOSPIDER_VERSION: 1.1.6
          GOSPIDER_SHA256: 41bdd76aff8d063655dc473f035ca7659f8549fbf264be5185f50d288666f93d
          KITERUNNER_VERSION: 1.0.2
          KITERUNNER_SHA256: 6f0b70aabf747de592445a690281897eebbc45927e9264185d34ffb11637613b
          HTTPX_VERSION: v1.6.10
          HTTPX_SHA256: e7eb8473530c2d0eb4eb132c7253c0138745d622970f36413c1f349ddd60edb7
          FFUF_VERSION: 2.1.0
          FFUF_SHA256: fc2c82736c14dcbea4daf3d3cf3878c1c4773008ba45c2bc0fceba7d17b40bb5
          KATANA_VERSION: v1.8.0
          KATANA_SHA256: cb027ae99d0757061b70c07a15c7a80f62c5a535ab52c4a329f80c4b0a7309d2
          NAABU_VERSION: v2.6.1
          NAABU_SHA256: 018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90
        run: |
          # Same pins as scheduled-scans.yml, so the integration tests exercise
          # exactly what production installs.
          curl -fsSL "https://github.com/projectdiscovery/nuclei/releases/download/${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION#v}_linux_amd64.zip" -o /tmp/nuclei.zip
          echo "${NUCLEI_SHA256}  /tmp/nuclei.zip" | sha256sum -c -
          sudo unzip -o /tmp/nuclei.zip -d /usr/local/bin nuclei && sudo chmod +x /usr/local/bin/nuclei
          nuclei -update-templates -silent || true

          curl -fsSL "https://github.com/projectdiscovery/httpx/releases/download/${HTTPX_VERSION}/httpx_${HTTPX_VERSION#v}_linux_amd64.zip" -o /tmp/httpx.zip
          echo "${HTTPX_SHA256}  /tmp/httpx.zip" | sha256sum -c -
          sudo unzip -o /tmp/httpx.zip httpx -d /usr/local/bin && sudo chmod +x /usr/local/bin/httpx
          httpx -version

          curl -fsSL "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz" -o /tmp/ffuf.tar.gz
          echo "${FFUF_SHA256}  /tmp/ffuf.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/ffuf.tar.gz -C /usr/local/bin ffuf && sudo chmod +x /usr/local/bin/ffuf
          ffuf -V

          curl -fsSL "https://github.com/projectdiscovery/katana/releases/download/${KATANA_VERSION}/katana_${KATANA_VERSION#v}_linux_amd64.zip" -o /tmp/katana.zip
          echo "${KATANA_SHA256}  /tmp/katana.zip" | sha256sum -c -
          sudo unzip -o /tmp/katana.zip katana -d /usr/local/bin && sudo chmod +x /usr/local/bin/katana
          katana -version

          sudo apt-get install -y libpcap-dev >/dev/null 2>&1 || true
          curl -fsSL "https://github.com/projectdiscovery/naabu/releases/download/${NAABU_VERSION}/naabu_${NAABU_VERSION#v}_linux_amd64.zip" -o /tmp/naabu.zip
          echo "${NAABU_SHA256}  /tmp/naabu.zip" | sha256sum -c -
          sudo unzip -o /tmp/naabu.zip naabu -d /usr/local/bin && sudo chmod +x /usr/local/bin/naabu
          naabu -version

          curl -fsSL "https://github.com/jaeles-project/gospider/releases/download/v${GOSPIDER_VERSION}/gospider_v${GOSPIDER_VERSION}_linux_x86_64.zip" -o /tmp/gospider.zip
          echo "${GOSPIDER_SHA256}  /tmp/gospider.zip" | sha256sum -c -
          unzip -o /tmp/gospider.zip -d /tmp/gospider
          sudo install "/tmp/gospider/gospider_v${GOSPIDER_VERSION}_linux_x86_64/gospider" /usr/local/bin/gospider

          curl -fsSL "https://github.com/assetnote/kiterunner/releases/download/v${KITERUNNER_VERSION}/kiterunner_${KITERUNNER_VERSION}_linux_amd64.tar.gz" -o /tmp/kiterunner.tar.gz
          echo "${KITERUNNER_SHA256}  /tmp/kiterunner.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kiterunner.tar.gz -C /usr/local/bin kr && sudo chmod +x /usr/local/bin/kr
          sudo mkdir -p /opt/kiterunner
          kr kb convert src/worker/tools/wordlists/api-routes.txt /opt/kiterunner/api-routes.kite

      - name: Start the local test app
        run: |
          nohup python3 tests/fixtures/test-app/app.py > /tmp/test-app.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/ >/dev/null && break; sleep 1; done
          curl -fs "http://127.0.0.1:8099/item?id=1"
          curl -fs "http://127.0.0.1:8099/api/health"

      - name: Real-binary integration tests (sqlmap, nuclei, gospider, kiterunner)
        env:
          RUN_TOOL_INTEGRATION: "1"
          KITERUNNER_WORDLIST: /opt/kiterunner/api-routes.kite
        run: >
          npx vitest run
          src/worker/tools/sqlmap.integration.test.ts
          src/worker/tools/nuclei.integration.test.ts
          src/worker/tools/gospider.integration.test.ts
          src/worker/tools/kiterunner.integration.test.ts
          src/worker/tools/httpProbe.integration.test.ts
          src/worker/tools/contentDiscovery.integration.test.ts
          src/worker/tools/badsecrets.integration.test.ts
          src/worker/tools/katana.integration.test.ts
          src/worker/tools/networkExposure.integration.test.ts

      # commix's output format has only been checked against a captured negative
      # run so far (src/worker/tools/fixtures). This step installs it, runs it
      # against the local test app, prints what it emits (readable straight from
      # the job log) and saves it as an artifact. Informational: never fails the job.
      - name: Capture commix output
        continue-on-error: true
        run: |
          mkdir -p /tmp/capture
          git clone --depth 1 https://github.com/commixproject/commix.git /tmp/commix || true
          if [ -f /tmp/commix/commix.py ]; then
            python3 /tmp/commix/commix.py --version > /tmp/capture/commix.version.txt 2>&1 || true
            timeout 120 python3 /tmp/commix/commix.py --url="http://127.0.0.1:8099/search?q=a" --batch > /tmp/capture/commix.clean.stdout.txt 2> /tmp/capture/commix.clean.stderr.txt || true
          else
            echo "commix could not be cloned" > /tmp/capture/commix.not-installed.txt
          fi

      - name: Print captured output
        if: always()
        run: |
          for f in /tmp/capture/*; do
            echo "::group::$(basename "$f")"
            head -c 20000 "$f" | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'
            echo
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tool-output
          path: /tmp/capture/
          if-no-files-found: ignore
