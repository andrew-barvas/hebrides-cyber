name: Tool integration

# Runs the real sqlmap, nuclei, gospider and kiterunner (and, informationally,
# commix) against a deliberately vulnerable app on localhost, so the parsers in
# src/worker/tools are checked against real output rather than assumptions
# (E-72). Weekly, on changes to the tool wrappers, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "hebridescyber-app/src/worker/tools/sqlmap*.ts"
      - "hebridescyber-app/src/worker/tools/commix*.ts"
      - "hebridescyber-app/src/worker/tools/dalfox*.ts"
      - "hebridescyber-app/src/worker/tools/nuclei*.ts"
      - "hebridescyber-app/src/worker/tools/gospider*.ts"
      - "hebridescyber-app/src/worker/tools/kiterunner*.ts"
      - "hebridescyber-app/src/worker/tools/httpProbe*.ts"
      - "hebridescyber-app/src/worker/tools/contentDiscovery*.ts"
      - "hebridescyber-app/src/worker/tools/badsecrets*.ts"
      - "hebridescyber-app/src/worker/tools/whatwaf*.ts"
      - "hebridescyber-app/src/worker/tools/katana*.ts"
      - "hebridescyber-app/src/lib/scanners/crawler.ts"
      - "hebridescyber-app/src/worker/tools/wordlists/**"
      - "hebridescyber-app/src/lib/scanners/hostProbe*.ts"
      - "hebridescyber-app/src/worker/tools/networkExposure*.ts"
      - "hebridescyber-app/src/worker/tools/nmap*.ts"
      - "hebridescyber-app/src/worker/tools/zap*.ts"
      - "hebridescyber-app/src/worker/tools/arjun*.ts"
      - "hebridescyber-app/src/lib/execTool.ts"
      - "hebridescyber-app/tests/fixtures/test-app/**"
      - ".github/workflows/tool-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hebridescyber-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - run: npm ci

      - name: Install sqlmap
        run: pip3 install --break-system-packages sqlmap

      - name: Install whatwaf (pinned to v1.9; not on PyPI)
        # WhatWaf has no PyPI package; install from the pinned v1.9 tag, whose
        # setup.py installs the `whatwaf` script the wrapper calls. Three traps,
        # all only reachable by actually running the install — which
        # scheduled-scans.yml (schedule-only) never did in CI, so its sudo
        # `pip install /opt/whatwaf` has never worked and whatwaf has been
        # silently not_configured in production:
        #   1. setup.py imports lib.settings -> bs4 at metadata-generation time,
        #      so the runtime deps must be installed FIRST or egg_info fails
        #      with ModuleNotFoundError.
        #   2. setup.py calls raw_input for a username only when run as root
        #      (os.getuid() == 0); under pip's closed stdin that is an EOFError
        #      that aborts the build. So install UNPRIVILEGED (no sudo):
        #      getpass.getuser() is used instead and there is no prompt.
        #   3. setup.py's install_helper.sh populates ~/.whatwaf (plugins,
        #      tampers) in the INVOKING user's home; a sudo install would put it
        #      in /root/.whatwaf, but whatwaf runs as the runner at scan time
        #      and reads /home/runner/.whatwaf. Unprivileged install puts it in
        #      the right home.
        # ~/.local/bin is already on the runner PATH (the sqlmap step relies on
        # that too). No `|| true`: a failed install must fail the job (rule 15),
        # and `command -v` proves the script is on PATH.
        run: |
          git clone --depth 1 --branch v1.9 https://github.com/Ekultek/WhatWaf.git /tmp/whatwaf
          pip3 install --break-system-packages -r /tmp/whatwaf/requirements.txt
          pip3 install --break-system-packages /tmp/whatwaf
          command -v whatwaf

      - name: Install nmap (for networkExposure service detection)
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Install badsecrets (pinned, own virtualenv)
        # Same install as scheduled-scans.yml.
        run: |
          sudo python3 -m venv /opt/badsecrets
          sudo /opt/badsecrets/bin/pip install --quiet badsecrets==1.2.0
          sudo ln -sf /opt/badsecrets/bin/badsecrets /usr/local/bin/badsecrets
          badsecrets -l --no-color | tail -5

      - name: Install dalfox (pinned, SHA-256 verified)
        # Same pin as scheduled-scans.yml, so the integration test exercises
        # exactly what production installs.
        env:
          DALFOX_VERSION: 3.2.4
          DALFOX_SHA256: aaef3f3d26d2de6d4e61ef5295151d9de36e111981618136ac7ec54b578582b8
        run: |
          curl -fsSL \
            "https://github.com/hahwul/dalfox/releases/download/v${DALFOX_VERSION}/dalfox-v${DALFOX_VERSION}-linux-x86_64.tar.gz" \
            -o /tmp/dalfox.tar.gz
          echo "${DALFOX_SHA256}  /tmp/dalfox.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dalfox.tar.gz -C /tmp
          sudo install "/tmp/dalfox-v${DALFOX_VERSION}-linux-x86_64/dalfox" /usr/local/bin/dalfox
          rm -rf /tmp/dalfox.tar.gz "/tmp/dalfox-v${DALFOX_VERSION}-linux-x86_64"
          dalfox --version

      - name: Install nuclei, gospider, kiterunner, httpx, ffuf, katana and naabu (pinned)
        env:
          NUCLEI_VERSION: v3.3.9
          NUCLEI_SHA256: dfecedc31364d70b7291b347c74fd4d1d3185d30301c025b7490717d29daf28a
          # Same pinned templates release as scheduled-scans.yml.
          NUCLEI_TEMPLATES_VERSION: v10.5.1
          GOSPIDER_VERSION: 1.1.6
          GOSPIDER_SHA256: 41bdd76aff8d063655dc473f035ca7659f8549fbf264be5185f50d288666f93d
          KITERUNNER_VERSION: 1.0.2
          KITERUNNER_SHA256: 6f0b70aabf747de592445a690281897eebbc45927e9264185d34ffb11637613b
          HTTPX_VERSION: v1.6.10
          HTTPX_SHA256: e7eb8473530c2d0eb4eb132c7253c0138745d622970f36413c1f349ddd60edb7
          FFUF_VERSION: 2.1.0
          FFUF_SHA256: fc2c82736c14dcbea4daf3d3cf3878c1c4773008ba45c2bc0fceba7d17b40bb5
          KATANA_VERSION: v1.8.0
          KATANA_SHA256: cb027ae99d0757061b70c07a15c7a80f62c5a535ab52c4a329f80c4b0a7309d2
          NAABU_VERSION: v2.6.1
          NAABU_SHA256: 018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90
        run: |
          # Same pins as scheduled-scans.yml, so the integration tests exercise
          # exactly what production installs.
          curl -fsSL "https://github.com/projectdiscovery/nuclei/releases/download/${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION#v}_linux_amd64.zip" -o /tmp/nuclei.zip
          echo "${NUCLEI_SHA256}  /tmp/nuclei.zip" | sha256sum -c -
          sudo unzip -o /tmp/nuclei.zip -d /usr/local/bin nuclei && sudo chmod +x /usr/local/bin/nuclei
          # Pin templates to the same tag as scheduled-scans.yml (not
          # `-update-templates`). Fail hard if the pinned set didn't land — this
          # job exists to catch exactly that kind of silent breakage.
          TEMPLATES_DIR="$HOME/nuclei-templates"
          git clone --depth 1 --branch "${NUCLEI_TEMPLATES_VERSION}" https://github.com/projectdiscovery/nuclei-templates.git "$TEMPLATES_DIR"
          mkdir -p "$HOME/.config/nuclei"
          printf '{"nuclei-templates-directory":"%s","nuclei-templates-version":"%s"}\n' "$TEMPLATES_DIR" "${NUCLEI_TEMPLATES_VERSION}" > "$HOME/.config/nuclei/.templates-config.json"
          count="$(find "$TEMPLATES_DIR" -name '*.yaml' | wc -l)"
          echo "nuclei templates ${NUCLEI_TEMPLATES_VERSION}: $count templates"
          [ "$count" -gt 1000 ] || { echo "::error::nuclei templates pin loaded only $count templates"; exit 1; }

          curl -fsSL "https://github.com/projectdiscovery/httpx/releases/download/${HTTPX_VERSION}/httpx_${HTTPX_VERSION#v}_linux_amd64.zip" -o /tmp/httpx.zip
          echo "${HTTPX_SHA256}  /tmp/httpx.zip" | sha256sum -c -
          sudo unzip -o /tmp/httpx.zip httpx -d /usr/local/bin && sudo chmod +x /usr/local/bin/httpx
          httpx -version

          curl -fsSL "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz" -o /tmp/ffuf.tar.gz
          echo "${FFUF_SHA256}  /tmp/ffuf.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/ffuf.tar.gz -C /usr/local/bin ffuf && sudo chmod +x /usr/local/bin/ffuf
          ffuf -V

          curl -fsSL "https://github.com/projectdiscovery/katana/releases/download/${KATANA_VERSION}/katana_${KATANA_VERSION#v}_linux_amd64.zip" -o /tmp/katana.zip
          echo "${KATANA_SHA256}  /tmp/katana.zip" | sha256sum -c -
          sudo unzip -o /tmp/katana.zip katana -d /usr/local/bin && sudo chmod +x /usr/local/bin/katana
          katana -version

          sudo apt-get install -y libpcap-dev >/dev/null 2>&1 || true
          curl -fsSL "https://github.com/projectdiscovery/naabu/releases/download/${NAABU_VERSION}/naabu_${NAABU_VERSION#v}_linux_amd64.zip" -o /tmp/naabu.zip
          echo "${NAABU_SHA256}  /tmp/naabu.zip" | sha256sum -c -
          sudo unzip -o /tmp/naabu.zip naabu -d /usr/local/bin && sudo chmod +x /usr/local/bin/naabu
          naabu -version

          curl -fsSL "https://github.com/jaeles-project/gospider/releases/download/v${GOSPIDER_VERSION}/gospider_v${GOSPIDER_VERSION}_linux_x86_64.zip" -o /tmp/gospider.zip
          echo "${GOSPIDER_SHA256}  /tmp/gospider.zip" | sha256sum -c -
          unzip -o /tmp/gospider.zip -d /tmp/gospider
          sudo install "/tmp/gospider/gospider_v${GOSPIDER_VERSION}_linux_x86_64/gospider" /usr/local/bin/gospider

          curl -fsSL "https://github.com/assetnote/kiterunner/releases/download/v${KITERUNNER_VERSION}/kiterunner_${KITERUNNER_VERSION}_linux_amd64.tar.gz" -o /tmp/kiterunner.tar.gz
          echo "${KITERUNNER_SHA256}  /tmp/kiterunner.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kiterunner.tar.gz -C /usr/local/bin kr && sudo chmod +x /usr/local/bin/kr
          sudo mkdir -p /opt/kiterunner
          kr kb convert src/worker/tools/wordlists/api-routes.txt /opt/kiterunner/api-routes.kite

      - name: Install arjun (pinned)
        # Same pin as scheduled-scans.yml, so the integration test exercises
        # exactly what production installs.
        run: pip3 install --break-system-packages arjun==2.2.7

      - name: Start the local test app
        run: |
          nohup python3 tests/fixtures/test-app/app.py > /tmp/test-app.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/ >/dev/null && break; sleep 1; done
          curl -fs "http://127.0.0.1:8099/item?id=1"
          curl -fs "http://127.0.0.1:8099/api/health"

      - name: Start ZAP daemon
        run: |
          # Same pinned-by-digest ZAP image as scheduled-scans.yml, with a
          # random per-run API key. --network host so the container's loopback
          # reaches the test app bound to 127.0.0.1:8099. ZAP_API_URL and
          # ZAP_API_KEY are exported for the test step via $GITHUB_ENV.
          ZAP_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$ZAP_KEY"
          echo "ZAP_API_KEY=$ZAP_KEY" >> "$GITHUB_ENV"
          echo "ZAP_API_URL=http://localhost:8090" >> "$GITHUB_ENV"
          docker run -d --name zap --network host \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.key="$ZAP_KEY" \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true
          for i in $(seq 1 24); do
            if curl -sf "http://localhost:8090/JSON/core/view/version/?apikey=$ZAP_KEY" >/dev/null; then
              echo "ZAP is ready"; exit 0
            fi
            echo "Waiting for ZAP ($i/24)..."; sleep 5
          done
          echo "::error::ZAP did not become ready in time"; exit 1

      - name: Real-binary integration tests (sqlmap, dalfox, nuclei, gospider, kiterunner, nmap, arjun, zap)
        env:
          RUN_TOOL_INTEGRATION: "1"
          KITERUNNER_WORDLIST: /opt/kiterunner/api-routes.kite
        run: >
          npx vitest run
          src/worker/tools/sqlmap.integration.test.ts
          src/worker/tools/dalfox.integration.test.ts
          src/worker/tools/nuclei.integration.test.ts
          src/worker/tools/gospider.integration.test.ts
          src/worker/tools/kiterunner.integration.test.ts
          src/worker/tools/httpProbe.integration.test.ts
          src/worker/tools/contentDiscovery.integration.test.ts
          src/worker/tools/badsecrets.integration.test.ts
          src/worker/tools/whatwaf.integration.test.ts
          src/worker/tools/katana.integration.test.ts
          src/worker/tools/networkExposure.integration.test.ts
          src/worker/tools/nmap.integration.test.ts
          src/worker/tools/arjun.integration.test.ts
          src/worker/tools/zap.integration.test.ts

      - name: Stop ZAP daemon
        if: always()
        run: docker rm -f zap || true

      # Captures the real WhatWaf stdout/stderr against the local app, exactly
      # as whatwaf.ts invokes it and with stdin closed like execTool does, so
      # the true verdict lines and any interactive-prompt crash are visible in
      # the job log and the uploaded artifact (readable straight from the log
      # below). Informational: never fails the job.
      - name: Capture whatwaf output
        # always(): the whatwaf test step above may fail, and a step without
        # this is skipped after an earlier failure (continue-on-error only stops
        # a step's OWN failure from failing the job), so the capture must be
        # unconditional to record the real output either way.
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/capture
          whatwaf -u http://127.0.0.1:8099/ --ra --throttle 3 --skip \
            > /tmp/capture/whatwaf.local.stdout.txt \
            2> /tmp/capture/whatwaf.local.stderr.txt < /dev/null
          echo "whatwaf exit=$?" > /tmp/capture/whatwaf.exit.txt

      # commix's output format has only been checked against a captured negative
      # run so far (src/worker/tools/fixtures). This step installs it, runs it
      # against the local test app, prints what it emits (readable straight from
      # the job log) and saves it as an artifact. Informational: never fails the job.
      - name: Capture commix output
        continue-on-error: true
        run: |
          mkdir -p /tmp/capture
          # Same v4.1 tag as scheduled-scans.yml, so this captures what production runs.
          git clone --depth 1 --branch v4.1 https://github.com/commixproject/commix.git /tmp/commix || true
          if [ -f /tmp/commix/commix.py ]; then
            python3 /tmp/commix/commix.py --version > /tmp/capture/commix.version.txt 2>&1 || true
            timeout 120 python3 /tmp/commix/commix.py --url="http://127.0.0.1:8099/search?q=a" --batch > /tmp/capture/commix.clean.stdout.txt 2> /tmp/capture/commix.clean.stderr.txt || true
          else
            echo "commix could not be cloned" > /tmp/capture/commix.not-installed.txt
          fi

      # cmsmap has no PyPI package, so scheduled-scans.yml installs it from a
      # pinned git commit. That install only ever ran on the daily job, where a
      # failure is deliberately soft, so a broken pin would have gone unnoticed
      # (the way `pip install cmsmap` did until 2026-10-28). This runs the same
      # install hard: it must resolve and put a working `cmsmap` on PATH.
      - name: Check the pinned cmsmap install
        run: |
          mkdir -p /tmp/capture
          sudo git clone https://github.com/Dionach/CMSmap.git /opt/cmsmap
          sudo git -C /opt/cmsmap checkout 59dd0e2b3b0c751c6da2b0565374ab83c736b0e6
          sudo pip3 install --break-system-packages /opt/cmsmap
          command -v cmsmap
          cmsmap --help > /tmp/capture/cmsmap.help.txt 2>&1 || true
          head -5 /tmp/capture/cmsmap.help.txt

      # The same hard check for whatwaf, with the recipe scheduled-scans.yml now
      # uses. #124's first version of that install (sudo pip3 install of the
      # clone) was never run on a runner and does not work: bs4 must be
      # installed before setup.py runs, and a root install prompts via raw_input
      # and writes ~/.whatwaf in root's home. This must put a `whatwaf` on PATH.
      - name: Check the pinned whatwaf install
        run: |
          git clone --depth 1 --branch v1.9 https://github.com/Ekultek/WhatWaf.git /tmp/whatwaf-check
          pip3 install --break-system-packages -r /tmp/whatwaf-check/requirements.txt
          pip3 install --break-system-packages /tmp/whatwaf-check
          command -v whatwaf
          # install_helper.sh rsyncs the plugins into ~/.whatwaf and setup.py
          # ignores its exit status, so a missing rsync would leave this empty.
          test -n "$(ls -A "$HOME/.whatwaf/plugins")"

      # The last installs from scheduled-scans.yml that no job ran, each hard,
      # run the way production runs it. always() so one failure doesn't hide the
      # others in the same run (whatwaf's install only looked fine until it was
      # actually run; these were in the same position). Running them found that
      # wpscan 4.2.0 needs Ruby >= 3.3 (the runner has 3.2.3) and that PyPI
      # `photon` installs no `photon` command, so the photon install was removed.
      - name: Check the pinned wpscan install
        if: always()
        run: |
          mkdir -p /tmp/capture
          sudo gem install wpscan -v 3.8.28 --no-document
          command -v wpscan
          gem list -i wpscan -v 3.8.28
          wpscan --version > /tmp/capture/wpscan.version.txt 2>&1 || true
          head -5 /tmp/capture/wpscan.version.txt

      - name: Check the pinned testssl.sh install
        if: always()
        run: |
          mkdir -p /tmp/capture
          sudo git clone --depth 1 --branch v3.2.4 https://github.com/testssl/testssl.sh.git /opt/testssl.sh
          test -x /opt/testssl.sh/testssl.sh
          test "$(sudo git -C /opt/testssl.sh describe --tags --exact-match)" = "v3.2.4"
          /opt/testssl.sh/testssl.sh --version > /tmp/capture/testssl.version.txt 2>&1 || true
          head -5 /tmp/capture/testssl.version.txt

      - name: Print captured output
        if: always()
        run: |
          for f in /tmp/capture/*; do
            echo "::group::$(basename "$f")"
            head -c 20000 "$f" | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'
            echo
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tool-output
          path: /tmp/capture/
          if-no-files-found: ignore
