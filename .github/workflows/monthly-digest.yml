name: Monthly Digest

# Sends the monthly Security Score digest email to every active subscriber
# (see hebridescyber-app/src/lib/monthlyDigest.ts). One email per
# subscriber, summarising the most recent completed scan for each of their
# monitored targets — not one email per scan.
#
# Runs src/scripts/send-monthly-digest.ts directly against Supabase, same
# pattern as daily-blog.yml/weekly-newsletter.yml, rather than curling the
# app's own API route. This used to deliberately stay HTTP-gated (the route
# sends real customer email) — docs/ENHANCEMENTS.md E-11 found the same
# execution-ceiling risk already hit and fixed twice elsewhere: a serial
# loop over every active subscriber, each iteration issuing 3+ Supabase
# queries plus an outbound email, all inside one Azure SWA Free-tier
# Functions request. Converted the same way, no HTTP hop, no
# DIGEST_SERVICE_TOKEN needed any more (the route it gated no longer
# exists).
#
# Requires:
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY - direct Supabase access
#   RESEND_API_KEY                            - email delivery
#   NEXT_PUBLIC_SITE_URL                      - optional, used for links in
#                                                the digest email

on:
  schedule:
    # 07:30 UTC on the 1st of every month.
    - cron: "30 7 1 * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Send the monthly digest
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # sendEmail (src/lib/email.ts) needs it; without it no digest was ever sent.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run digest:monthly
