version: "3.9"

# Local dev stack: Next.js app + Redis + BullMQ worker + ZAP daemon.
# Run: docker compose up
# The Next.js app is still started separately with `npm run dev` for HMR.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ZAP_API_URL=http://zap:8080
      - ZAP_API_KEY=changeme
      - WORKER_CONCURRENCY=2
    volumes:
      # Mount source for faster dev iteration — remove in prod builds
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    command:
      - zap.sh
      - -daemon
      - -host
      - "0.0.0.0"
      - -port
      - "8080"
      - -config
      - "api.key=changeme"
      - -config
      - "api.addrs.addr.name=.*"
      - -config
      - "api.addrs.addr.regex=true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/?apikey=changeme"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
