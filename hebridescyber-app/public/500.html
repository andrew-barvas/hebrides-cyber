<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Something went wrong — Hebrides Cyber</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070B14;
      color: #FFFFFF;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #0D1524;
      border: 1px solid #1C2940;
      border-radius: 12px;
      padding: 2.5rem;
    }
    .tag {
      font-size: 0.75rem;
      color: #39FFC0;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    a:hover { opacity: 0.8; }
    .btn-primary {
      background: #39FFC0;
      color: #070B14;
    }
    .btn-secondary {
      background: transparent;
      color: #39FFC0;
      border: 1px solid #1C2940;
    }
    .divider {
      border: none;
      border-top: 1px solid #1C2940;
      margin: 2rem 0;
    }
    .footer {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
    }
    .footer a { color: rgba(57,255,192,0.5); font-size: 0.75rem; padding: 0; background: none; border: none; }
    .footer a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <p class="tag">// 500 — server error</p>
    <h1>Something went wrong on our end</h1>
    <p>
      The server hit an unexpected error. This is usually temporary — try
      refreshing or come back in a moment. If it keeps happening, contact us
      and we'll look into it.
    </p>
    <div class="actions">
      <a href="/" class="btn-primary">Go to homepage</a>
      <a href="/dashboard" class="btn-secondary">Dashboard</a>
    </div>
    <hr class="divider" />
    <p class="footer">
      Hebrides Cyber &mdash;
      <a href="mailto:hello@hebridescyber.co.uk">hello@hebridescyber.co.uk</a>
    </p>
  </div>
</body>
</html>
