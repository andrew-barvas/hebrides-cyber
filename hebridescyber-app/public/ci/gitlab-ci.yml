# Hebrides Cyber security scan for GitLab CI.
#
# 1. Save https://www.hebridescyber.co.uk/ci/hebrides-scan.sh in your repository
#    as ci/hebrides-scan.sh.
# 2. Settings -> CI/CD -> Variables: add HEBRIDES_CYBER_API_KEY (masked,
#    protected) and HEBRIDES_TARGET_URL (a site you have verified).
# 3. Add this job to .gitlab-ci.yml (or `include:` this file).
#
# Fails only on new findings at or above HEBRIDES_FAIL_ON that you have not
# triaged. New findings also appear in the merge request's test report.

hebrides_security_scan:
  stage: test
  image: alpine:3.20
  variables:
    HEBRIDES_FAIL_ON: "high"
    HEBRIDES_JUNIT_FILE: "hebrides-junit.xml"
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh ci/hebrides-scan.sh
  artifacts:
    when: always
    paths:
      - hebrides-scan.json
    reports:
      junit: hebrides-junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
