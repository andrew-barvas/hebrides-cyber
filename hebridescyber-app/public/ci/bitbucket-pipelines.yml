# Hebrides Cyber security scan for Bitbucket Pipelines.
#
# 1. Save https://www.hebridescyber.co.uk/ci/hebrides-scan.sh in your repository
#    as ci/hebrides-scan.sh.
# 2. Repository settings -> Repository variables: add HEBRIDES_CYBER_API_KEY
#    (tick "Secured") and HEBRIDES_TARGET_URL (a site you have verified).
# 3. Merge this into bitbucket-pipelines.yml. Run the custom pipeline from
#    a schedule (Pipelines -> Schedules) for a weekly scan.
#
# Fails only on new findings at or above HEBRIDES_FAIL_ON that you have not
# triaged. Bitbucket reads the JUnit report from test-results/, so new
# findings also appear in the pipeline's Tests tab.

definitions:
  steps:
    - step: &hebrides-security-scan
        name: Hebrides Cyber security scan
        image: alpine:3.20
        script:
          - apk add --no-cache curl jq
          - mkdir -p test-results
          - export HEBRIDES_FAIL_ON=high
          - export HEBRIDES_JUNIT_FILE=test-results/hebrides-junit.xml
          - sh ci/hebrides-scan.sh
        artifacts:
          - hebrides-scan.json

pipelines:
  pull-requests:
    "**":
      - step: *hebrides-security-scan
  custom:
    security-scan:
      - step: *hebrides-security-scan
