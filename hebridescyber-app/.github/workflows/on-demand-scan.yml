name: On-Demand Scan

# Fast path for the dashboard's "Run scan" button. Azure Static Web Apps'
# Free-tier managed Functions cannot safely run the full scan pipeline
# synchronously inside the HTTP request — the check suite makes many live
# outbound calls and the platform has no configurable timeout on this SKU
# (`az staticwebapp functions show` refuses to even run on Free). Customers
# were seeing "Backend call failure" (an Azure proxy error, not anything this
# app emits) whenever a scan ran long.
#
# src/pages/api/run-scan.ts now enqueues a scan_jobs row (with scan_id
# pre-set to the scans row it already created) and returns immediately with
# { status: "queued" }, then calls the GitHub API to dispatch this workflow
# instead of waiting for the next scheduled-scans.yml cron. The dashboard
# polls run-scan again until the job completes.
#
# Deliberately separate from scheduled-scans.yml rather than reusing its
# `work` job: on-demand jobs never use the real active-scanning tool suite
# (see run-queued-scan-jobs.ts's job.scan_id branch), so this workflow skips
# the ~2-3 minutes of nmap/sqlmap/nuclei/testssl.sh/gitleaks installs and the
# ZAP daemon entirely — just checkout, npm ci, run the worker once.
#
# If GITHUB_PAT isn't configured for run-scan.ts to dispatch this (see
# .env.example), on-demand jobs still get processed — scheduled-scans.yml's
# daily cron claims from the same scan_jobs queue — just with up to a
# 24-hour delay instead of roughly a minute.
#
# Requires:
#   SUPABASE_URL                 - to claim/complete scan_jobs
#   SUPABASE_SERVICE_ROLE_KEY    - server-side only, never exposed to logs

on:
  workflow_dispatch: {}

concurrency:
  group: on-demand-scan
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hebridescyber-app/package-lock.json
      - name: Install dependencies
        working-directory: hebridescyber-app
        run: npm ci
      - name: Work the scan job queue (on-demand jobs — passive checks only)
        working-directory: hebridescyber-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_ID: gha-ondemand-${{ github.run_id }}
        run: npm run queue:run-worker
